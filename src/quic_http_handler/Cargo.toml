[package]
name = "quic_http_handler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bytes = "1"
boring = "4.22.0"
futures-util = "0.3"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-quiche = { path = "../../vendor/quiche/tokio-quiche", default-features = false }
webpki-root-certs = "1.0.9"

[build-dependencies]
csbindgen = "1.9.8"
